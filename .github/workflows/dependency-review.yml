# Source: actions/dependency-review-action docs.
# NOTE: gated on non-private repos (dependency review data needs Advanced Security on private).
name: Dependency Review
on: [pull_request]
permissions:
  contents: read
jobs:
  review:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4 # v4 (no bare major tag upstream; pinned to v4.9.0)
        with:
          fail-on-severity: high
          deny-licenses: "GPL-2.0, GPL-3.0, AGPL-3.0, SSPL-1.0"
